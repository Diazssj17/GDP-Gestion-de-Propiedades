services:
  - type: web
    name: gdp-gestion-propiedades
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USUARIO
        sync: false
      - key: SMTP_CLAVE
        sync: false
      - key: BASE_URL
        sync: false
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_BASE_URL
        value: https://production.wompi.co/v1
      - key: WOMPI_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_NUMERO
        value: "573156652423"

  - type: cron
    name: cobro-recurrente-diario
    runtime: python
    schedule: "0 5 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python cobros_diarios.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRIVATE_KEY
        sync: false
      - key: WOMPI_BASE_URL
        value: https://production.wompi.co/v1
